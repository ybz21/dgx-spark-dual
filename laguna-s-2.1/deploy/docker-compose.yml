# Laguna-S-2.1-NVFP4 on vLLM，用 DFlash(EAGLE3 草稿模型)做投机解码
# 目标机: 192.168.130.12 (DGX Spark / GB10 / aarch64)
# 起服务:  docker compose up -d   →  OpenAI 接口 http://<host>:8000/v1
#          model id = laguna-s-2.1
#
# ⚠️ 内存: 主模型 NVFP4 ~72GB + KV，占用大半统一内存。启动前需先停掉 DS4
#          (pkill ds4-server)，两者不能同时在这台机跑。
services:
  laguna-vllm:
    image: vllm/vllm-openai:v0.26.0
    container_name: laguna-vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host                       # vLLM 需要大 /dev/shm，用 host IPC 最稳
    ports:
      - "8000:8000"
    volumes:
      - /home/ai/models:/models:ro  # 模型只读挂载
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HUB_OFFLINE=1            # 离线，不去连被墙的 huggingface
      - VLLM_NO_USAGE_STATS=1
    command:
      - --model
      - /models/Laguna-S-2.1-NVFP4
      - --served-model-name
      - laguna-s-2.1
      - --trust-remote-code                       # Laguna 自定义架构
      - --speculative-config
      - '{"model":"/models/Laguna-S-2.1-DFlash-NVFP4","num_speculative_tokens":7}'
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.9"
      - --enable-prefix-caching
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 600s            # 加载 72GB + 构建投机栈，给足冷启时间

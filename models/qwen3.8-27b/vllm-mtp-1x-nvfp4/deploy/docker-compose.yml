# Qwen3.8-27B-NVFP4 on vLLM 0.27.1 · 官方 MTP 投机解码 · Function Call · 256k
# 目标机: 192.168.130.48 (box010)   model id = qwen3.8-27b   端口 :8000
# 起服务:  docker compose up -d   →  OpenAI 兼容 http://<host>:8000/v1
#
# ★ 本配置为生产/agent 推荐配置：官方 MTP(接受率 44-49%) + 工具调用(function call) + 256k 上下文。
#   实测: 单流 代码/数学 ~30 tok/s、并发稳到 8、工具调用正确返回结构化 tool_calls。
#
# ⚠️ 镜像: 必须 vLLM ≥0.27（Qwen3.8 NVFP4 的 lm_head 也量化，旧版加载报错）。
#   `vllm/vllm-openai:latest`(docker hub, 0.27.1)；ghcr 的 spark-arena nightly 本网被墙。
#   box010 外网慢: 外网快的机器 `docker pull --platform linux/arm64` → `docker save
#   --platform linux/arm64 -o tar`(9.9GB) → 局域网传到 box010 → `docker load`。
# ⚠️ MTP 并发: 实测 max-num-seqs=4 + 干净 GPU 下并发稳到 8(超出排队)。若把 max-num-seqs
#   开很大且同机有别的进程 churn GPU，MTP 投机可能触发 CUDA illegal memory access。保守用 4。
services:
  qwen38-vllm:
    image: vllm/vllm-openai:latest        # 0.27.1 arm64（从 tar docker load 进来）
    container_name: qwen38-vllm
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    ipc: host
    shm_size: "16g"
    volumes:
      - ${MODELS_DIR:-/home/ai/models}:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_NO_USAGE_STATS=1
    # entrypoint 默认即 `vllm serve`；模型路径为位置参数（不是 --model）
    command:
      - /models/Qwen3.8-27B-NVFP4
      - --served-model-name
      - qwen3.8-27b
      - --trust-remote-code
      # ---- 官方 MTP 投机解码（模型自带 model_mtp.safetensors）----
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":5}'
      # ---- Function Call / 工具调用（agent 必须）----
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      # ---- 上下文 / 内存 / 并发 ----
      - --max-model-len
      - "262144"                          # 原生上限 256k(max_position_embeddings=262144)
      - --gpu-memory-utilization
      - "0.60"
      - --max-num-seqs
      - "4"                               # MTP 稳定并发；超出排队(实测扛到 8)
      - --enable-prefix-caching
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 600s
